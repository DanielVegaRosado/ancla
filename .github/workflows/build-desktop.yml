name: Compilar app de escritorio

# PyInstaller no compila cruzado (un .exe se genera EN Windows, un .app EN
# macOS), así que la única forma práctica de tener los dos ejecutables sin
# tener las dos máquinas es una matriz de runners, uno de cada sistema
# operativo, compilando en paralelo con el mismo desktop.spec.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  compilar:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements-desktop.txt

      - name: Compilar con PyInstaller
        run: pyinstaller --noconfirm desktop.spec

      # desktop.spec solo empaqueta ancla/web/templates y static (código de
      # la app) dentro del ejecutable a propósito: docx-templates/,
      # canva-templates/ y html-templates/ siguen el mismo patrón de "añadir
      # una plantilla es dejar sus ficheros en una carpeta" que ya tienen en
      # el repo (ver cada README), así que viajan como carpetas sueltas
      # junto al ejecutable en vez de incrustadas de forma no editable.
      # data_root() (ancla/web/routes.py) ya las busca ahí cuando la app
      # está congelada.
      - name: Preparar carpeta de publicación (ejecutable + plantillas editables)
        shell: bash
        run: |
          mkdir -p dist/paquete
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp dist/Ancla.exe dist/paquete/
          else
            cp -r dist/Ancla.app dist/paquete/
          fi
          cp -r docx-templates canva-templates html-templates dist/paquete/

      - name: Comprimir (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/paquete/* -DestinationPath dist/Ancla-Windows.zip

      - name: Subir (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Ancla-Windows
          path: dist/Ancla-Windows.zip

      - name: Comprimir (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc dist/paquete dist/Ancla-macOS.zip

      - name: Subir (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Ancla-macOS
          path: dist/Ancla-macOS.zip

  publicar:
    needs: compilar
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Ancla-Windows/Ancla-Windows.zip
            dist/Ancla-macOS/Ancla-macOS.zip
