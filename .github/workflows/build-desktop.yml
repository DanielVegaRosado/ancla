name: Compilar app de escritorio

# PyInstaller no compila cruzado (un .exe se genera EN Windows, un .app EN
# macOS, un binario EN Linux), así que la única forma práctica de tener los
# tres ejecutables sin tener las tres máquinas es una matriz de runners, uno
# de cada sistema operativo, compilando en paralelo con el mismo
# desktop.spec.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  compilar:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Linux no pasa por aquí (ver los pasos de Flatpak más abajo): ese
      # camino no usa PyInstaller en absoluto, así que no necesita Python
      # ni pip en el runner.
      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        if: runner.os != 'Linux'
        run: pip install -r requirements-desktop.txt

      - name: Compilar con PyInstaller
        if: runner.os != 'Linux'
        run: pyinstaller --noconfirm desktop.spec

      # canva-templates/ y html-templates/ son de solo lectura, nunca datos
      # del usuario (esos van a %APPDATA%\Ancla o ~/Library/Application
      # Support/Ancla, ver ancla/web/routes.py). En Windows viajan como
      # carpetas sueltas junto al .exe, editables sin recompilar;
      # templates_root() las busca ahí. En macOS NO: desktop.spec ya las
      # mete dentro del ejecutable, porque una carpeta al lado de Ancla.app
      # se pierde con App Translocation o al arrastrar solo el .app a
      # Aplicaciones.
      - name: Preparar carpeta de publicación (Windows/macOS)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          mkdir -p dist/paquete
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp dist/Ancla.exe dist/paquete/
            cp -r canva-templates html-templates dist/paquete/
          else
            cp -r dist/Ancla.app dist/paquete/
          fi

      # Linux: Flatpak, no PyInstaller/AppImage (ver
      # bitácora/build-escritorio-linux.md, entradas del 2026-09-09, para
      # por qué los dos intentos anteriores fallaron en la práctica).
      # `org.gnome.Platform`/`org.gnome.Sdk` ya traen GTK3+WebKit2GTK+
      # PyGObject probados entre sí, así que no hace falta empaquetarlos a
      # mano ni instalar nada de GTK por apt en el runner — solo el propio
      # `flatpak`/`flatpak-builder` y el runtime de GNOME.
      - name: Instalar flatpak y flatpak-builder (solo Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.gnome.Platform//50 org.gnome.Sdk//50

      # El módulo de dependencias Python (`python3-requirements.json`) se
      # regenera en cada build, no se comitea: las dependencias de Ancla
      # (`requirements.txt`) cambian con poca frecuencia, pero regenerarlo
      # aquí evita que el fichero versionado se quede desincronizado de
      # `requirements.txt` sin que nadie lo note hasta que el build falla o,
      # peor, empaqueta una versión vieja en silencio. El generador corre en
      # un Python de sistema aparte (no dentro del sandbox de flatpak-builder,
      # que aún no existe en este punto), así que sí usa
      # `actions/setup-python`, pero solo aquí, para esta única herramienta.
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: "3.11"

      # flatpak-pip-generator resuelve un `-r otro-fichero.txt` anidado
      # relativo a una copia temporal suya, no al fichero que lo contiene
      # ni al directorio de trabajo — así que un requirements-flatpak.txt
      # con `-r requirements.txt` dentro falla a ciegas dentro del propio
      # generador. Se aplana aquí a un único fichero sin referencias
      # anidadas, en vez de arrastrar esa limitación al fichero versionado.
      #
      # `python3 -m flatpak_pip_generator`, no el script de consola que
      # instala pip: ese script (`entry_points.txt`) importa un `main` que
      # no existe en `__main__.py` (el módulo hace su trabajo directamente
      # al ejecutarse, no dentro de una función `main`) y revienta al
      # salir — después de haber generado ya el fichero de verdad, así que
      # el fallo es solo del wrapper, no del propio trabajo.
      - name: Generar dependencias Python del Flatpak (solo Linux)
        if: runner.os == 'Linux'
        run: |
          pip install flatpak-pip-generator
          cat requirements.txt empaquetado/flatpak/requirements-flatpak.txt \
            > /tmp/requirements-flatpak-aplanado.txt
          # pydantic-core (groq/openai/anthropic) y jiter (openai) son Rust
          # (piden maturin); pillow compila C/C++ con pybind11. Ninguno de
          # los dos toolchains existe en el sandbox de flatpak-builder, y
          # sin --prefer-wheels el generador puede elegir el .tar.gz fuente
          # de cualquiera de los tres en vez de una rueda ya compilada.
          # pypdfium2 ya trae rueda universal (py3-none-manylinux) para todo,
          # pero se añade igual por si acaso: más barato que otra ronda de CI.
          python3 -m flatpak_pip_generator \
            --runtime='org.gnome.Sdk//50' \
            --requirements-file=/tmp/requirements-flatpak-aplanado.txt \
            --prefer-wheels=pydantic-core,jiter,pillow,pypdfium2 \
            --output empaquetado/flatpak/python3-requirements

      - name: Construir el Flatpak (solo Linux)
        if: runner.os == 'Linux'
        run: |
          flatpak-builder --user --force-clean --repo=repo build-dir \
            empaquetado/flatpak/com.danielvegarosado.Ancla.yml
          mkdir -p dist
          flatpak build-bundle repo dist/Ancla-Linux.flatpak com.danielvegarosado.Ancla

      - name: Comprimir (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/paquete/* -DestinationPath dist/Ancla-Windows.zip

      - name: Subir (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Ancla-Windows
          path: dist/Ancla-Windows.zip

      - name: Comprimir (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc dist/paquete dist/Ancla-macOS.zip

      - name: Subir (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Ancla-macOS
          path: dist/Ancla-macOS.zip

      # `flatpak build-bundle` ya produce el artefacto final como un solo
      # fichero (lleva el runtime que necesita instalado aparte, no
      # dependencias de sistema sueltas), así que se sube tal cual.
      - name: Subir (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Ancla-Linux
          path: dist/Ancla-Linux.flatpak

  publicar:
    needs: compilar
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Ancla-Windows/Ancla-Windows.zip
            dist/Ancla-macOS/Ancla-macOS.zip
            dist/Ancla-Linux/Ancla-Linux.flatpak
