name: Compilar app de escritorio

# PyInstaller no compila cruzado (un .exe se genera EN Windows, un .app EN
# macOS, un binario EN Linux), así que la única forma práctica de tener los
# tres ejecutables sin tener las tres máquinas es una matriz de runners, uno
# de cada sistema operativo, compilando en paralelo con el mismo
# desktop.spec.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  compilar:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # En Linux NO se usa actions/setup-python: instala su propio Python
      # aislado del que ve apt, y python3-gi (más abajo) se registra en el
      # dist-packages del Python del sistema — con un Python aparte, el
      # backend GTK de pywebview no podría hacer `import gi`. El runner de
      # ubuntu-latest ya trae Python 3 de sistema, así que basta con usarlo.
      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: "3.11"

      # pywebview en Linux usa GTK como backend (webview.platforms.gtk, ver
      # desktop.spec): son bindings de sistema, no un paquete de PyPI, así
      # que hacen falta también estos paquetes de apt. gir1.2-webkit2-4.1 es
      # el motor de renderizado (WebKitGTK); pywebview cae solo a la 4.0 si
      # no la encuentra, pero los runners de ubuntu-latest sí la traen.
      - name: Instalar dependencias de sistema (GTK + WebKit2, solo Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1 \
            gir1.2-soup-3.0 \
            python3-venv

      # Un venv normal aislaría python3-gi (instalado por apt en el Python de
      # sistema, no visible desde un venv corriente). `--system-site-packages`
      # lo hereda sin más, así que pip vuelve a instalar en un venv propio en
      # vez de sobre el Python de sistema — evita que reinstale un paquete que
      # ya puso `apt` (typing_extensions, en concreto: pip no puede
      # desinstalarlo primero porque dpkg no deja el `RECORD` que pip espera).
      - name: Crear venv con acceso a los paquetes de sistema (solo Linux)
        if: runner.os == 'Linux'
        run: |
          python3 -m venv --system-site-packages .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Instalar dependencias
        run: pip install -r requirements-desktop.txt

      - name: Compilar con PyInstaller
        run: pyinstaller --noconfirm desktop.spec

      # desktop.spec solo empaqueta ancla/web/templates y static (código de
      # la app) dentro del ejecutable a propósito: canva-templates/ y
      # html-templates/ siguen el mismo patrón de "añadir una plantilla es
      # dejar sus ficheros en una carpeta" que ya tienen en el repo (ver
      # cada README), así que viajan como carpetas sueltas junto al
      # ejecutable en vez de incrustadas de forma no editable. data_root()
      # (ancla/web/routes.py) ya las busca ahí cuando la app está congelada.
      # Linux no pasa por aquí (ver el paso de construir el AppImage más
      # abajo): un AppImage es un único fichero de solo lectura, así que no
      # hay "carpeta junto al binario" que dejar editable — las plantillas
      # van dentro del propio AppDir en su lugar.
      - name: Preparar carpeta de publicación (ejecutable + plantillas editables, Windows/macOS)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          mkdir -p dist/paquete
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp dist/Ancla.exe dist/paquete/
          else
            cp -r dist/Ancla.app dist/paquete/
          fi
          cp -r canva-templates html-templates dist/paquete/

      # linuxdeploy (no vía apt: no hay paquete de sistema, se distribuye
      # como AppImage propio) arrastra al AppDir las librerías de sistema
      # que el binario de PyInstaller pide prestadas en tiempo de ejecución
      # (ver bitácora build-escritorio-linux.md: esto es justo lo que el
      # .tar.gz anterior no hacía, y por lo que no arrancaba fuera del
      # runner). linuxdeploy-plugin-gtk es el que sabe además arrastrar
      # WebKitGTK/GTK3 y sus dependencias de sistema — los mismos paquetes
      # de apt instalados arriba, que aquí no son solo para compilar sino
      # también el material fuente que el plugin va a copiar dentro del
      # AppDir. Ambos son binarios ejecutables sueltos: `continuous` es el
      # release que cada proyecto mantiene siempre apuntando a la última
      # build de su rama principal.
      - name: Descargar linuxdeploy + plugin GTK (solo Linux)
        if: runner.os == 'Linux'
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh

      # linuxdeploy en sí es un AppImage, y montarlo necesita FUSE — que los
      # runners de ubuntu-latest actuales (basados en Ubuntu 22.04+, que
      # dejó de traer libfuse2 por defecto) no tienen. La propia
      # documentación de AppImage recomienda este modo de fallback:
      # extraerse a una carpeta temporal y ejecutarse desde ahí en vez de
      # montarse vía FUSE. Se fija por variable de entorno para que aplique
      # también dentro del propio proceso de linuxdeploy cuando invoque a
      # appimagetool internamente para el --output appimage final.
      # canva-templates/ y html-templates/ se copian DENTRO del AppDir, junto
      # al binario (usr/bin/), no al lado del .AppImage final: un AppImage es
      # un único fichero (una imagen squashfs de solo lectura), no hay "junto
      # al ejecutable" posible como en Windows/macOS. data_root()
      # (ancla/web/routes.py) resuelve la carpeta de datos como el directorio
      # de `sys.executable`, y un binario lanzado desde dentro de un AppImage
      # ve su propio `sys.executable` dentro del punto de montaje temporal
      # (`/tmp/.mount_*/usr/bin/Ancla`) — así que colocarlas en
      # `AppDir/usr/bin/` es lo que hace que se encuentren en tiempo de
      # ejecución sin tocar ese código. Sigue siendo peor que Windows/macOS
      # en un sentido real: esas dos plataformas dejan las carpetas como
      # ficheros sueltos editables sin recompilar nada (ver
      # html-templates/README.md, "añadir una plantilla es dejar sus
      # ficheros en una carpeta"), y aquí quedan encerradas en la imagen de
      # solo lectura — quien quiera una plantilla propia en Linux tiene que
      # extraer el AppImage (`--appimage-extract`) para tocarlas. Es la app
      # funcionando con las plantillas de fábrica lo que estaba realmente
      # roto (sin esto, cero plantillas, pantalla de exportar vacía), así que
      # se prioriza sobre esa editabilidad — sin verificar todavía contra un
      # runner real.
      - name: Construir el AppImage (solo Linux)
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          rm -rf AppDir
          mkdir -p AppDir/usr/bin
          cp dist/Ancla AppDir/usr/bin/Ancla
          cp -r canva-templates html-templates AppDir/usr/bin/
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable dist/Ancla \
            --desktop-file empaquetado/ancla.desktop \
            --icon-file empaquetado/iconos/ancla.png \
            --plugin gtk \
            --output appimage
          mkdir -p dist/paquete
          mv Ancla-*.AppImage dist/paquete/Ancla-Linux.AppImage
          chmod +x dist/paquete/Ancla-Linux.AppImage

      - name: Comprimir (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/paquete/* -DestinationPath dist/Ancla-Windows.zip

      - name: Subir (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Ancla-Windows
          path: dist/Ancla-Windows.zip

      - name: Comprimir (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc dist/paquete dist/Ancla-macOS.zip

      - name: Subir (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Ancla-macOS
          path: dist/Ancla-macOS.zip

      # El AppImage ya es el artefacto final (lleva GTK/WebKit y sus
      # dependencias dentro, ver el paso de construcción arriba), así que
      # no hace falta comprimirlo — se sube tal cual, como fichero único.
      - name: Subir (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Ancla-Linux
          path: dist/paquete/Ancla-Linux.AppImage

  publicar:
    needs: compilar
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Ancla-Windows/Ancla-Windows.zip
            dist/Ancla-macOS/Ancla-macOS.zip
            dist/Ancla-Linux/Ancla-Linux.AppImage
