{% extends "base.html" %}
{% block titulo %}{{ plantilla.name[idioma] }} · Ancla{% endblock %}
{% block contenido %}
  <p><a href="{{ url_for('ancla.canva_templates') }}">← {{ _('Plantillas') }}</a></p>
  <h1>{{ plantilla.name[idioma] }}</h1>
  <img
    class="vista-plantilla"
    src="{{ url_for('ancla.canva_template_detail_preview', id=plantilla.id) }}"
    alt="{{ plantilla.name[idioma] }}"
  >
  <p><a href="{{ url_for('ancla.canva_template_file', id=plantilla.id) }}">{{ _('Descargar el PDF original') }}</a></p>
{% endblock %}
