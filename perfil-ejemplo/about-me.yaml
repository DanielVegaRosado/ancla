plain_text:
  es: Desarrollador con experiencia en backend, bases de datos y despliegue en la nube, especializado en Python, PostgreSQL y Docker. Acostumbrado a trabajar de forma autónoma y a documentar lo que construyo para que el resto del equipo pueda seguir sin depender de mí.
  en: Developer experienced in backend, databases and cloud deployment, specialized in Python, PostgreSQL and Docker. Used to working autonomously and documenting what I build so the rest of the team can keep going without depending on me.
